<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline · Renewals</title>
<style>
  :root { color-scheme: light dark; --paper:#f6f7f5; --ink:#16201d; --muted:#5b6661; --accent:#0f5b50; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0f1513; --ink:#e7ece9; --muted:#9aa39e; --accent:#6cc3b2; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:24px; }
  main { max-width:420px; }
  h1 { font:400 28px/1.2 Georgia, serif; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 20px; }
  button { background:var(--accent); color:var(--paper); border:0; border-radius:8px; padding:10px 16px; font:600 15px system-ui, sans-serif; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>The Renewal System needs a connection. Nothing is stored on this device, so reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
